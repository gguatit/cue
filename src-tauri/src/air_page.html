<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Cue Air</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: "Malgun Gothic", "Segoe UI", sans-serif;
      }
      main {
        width: min(92vw, 760px);
        padding: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #f5b942;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .08em;
      }
      .brand::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f5b942;
        box-shadow: 0 0 18px #f5b94288;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: clamp(26px, 6vw, 42px);
        letter-spacing: -.03em;
      }
      #status {
        min-height: 24px;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.6;
      }
      #answer {
        margin-top: 28px;
        padding: 24px;
        min-height: 150px;
        display: flex;
        align-items: center;
        border: 1px solid #27272a;
        border-radius: 20px;
        background: #121216;
        font-size: clamp(24px, 5vw, 40px);
        font-weight: 700;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #answer.empty {
        color: #52525b;
        font-size: 18px;
        font-weight: 400;
      }
      footer {
        margin-top: 22px;
        color: #52525b;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">CUE AIR · LOCAL ONLY</div>
      <h1>최신 답변</h1>
      <div id="status">PC의 Cue에서 답변을 기다리는 중입니다.</div>
      <div id="answer" class="empty">아직 답변이 없습니다.</div>
      <footer>같은 Wi-Fi에서만 연결됩니다. 이 페이지는 답변을 저장하지 않습니다.</footer>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get('token') || ''
      const answer = document.getElementById('answer')
      const status = document.getElementById('status')
      let last = null
      let stopped = false

      function show(value) {
        if (value === last) return
        last = value
        if (value) {
          answer.textContent = value
          answer.classList.remove('empty')
          status.textContent = '새 답변이 도착했습니다.'
        } else {
          answer.textContent = '아직 답변이 없습니다.'
          answer.classList.add('empty')
        }
      }

      async function poll() {
        if (stopped) return
        if (!token) {
          status.textContent = 'QR 코드를 다시 스캔해 주세요.'
          return
        }
        try {
          const response = await fetch('/api/latest?token=' + encodeURIComponent(token), {
            cache: 'no-store',
          })
          if (response.status === 403) {
            stopped = true
            status.textContent = '연결이 만료되었습니다. PC에서 QR을 다시 열어 주세요.'
            return
          }
          if (!response.ok) throw new Error('http')
          const payload = await response.json()
          show(payload.answer || '')
          status.textContent = payload.answer
            ? 'Cue의 최신 답변입니다.'
            : 'PC의 Cue에서 답변을 기다리는 중입니다.'
        } catch {
          status.textContent = 'PC와의 연결을 확인하는 중입니다.'
        }
        setTimeout(poll, 800)
      }

      poll()
    </script>
  </body>
</html>
