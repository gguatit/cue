<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <title>Cue Air</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 50% 0%, #1d1d24 0%, #09090b 44%, #09090b 100%);
        color: #f4f4f5;
        font-family: "Malgun Gothic", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100% - 32px, 560px);
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #f5b942;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .12em;
      }
      .brand::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f5b942;
        box-shadow: 0 0 18px #f5b94288;
      }
      .badge {
        padding: 5px 9px;
        border: 1px solid #3f3f46;
        border-radius: 999px;
        color: #a1a1aa;
        font-size: 10px;
        letter-spacing: .06em;
      }
      h1 {
        margin: 38px 0 10px;
        font-size: clamp(27px, 7vw, 40px);
        line-height: 1.2;
        letter-spacing: -.035em;
      }
      .sub {
        margin: 0;
        color: #71717a;
        font-size: 13px;
        line-height: 1.65;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 22px;
        margin-top: 18px;
        color: #a1a1aa;
        font-size: 12.5px;
        line-height: 1.5;
      }
      .dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: #71717a;
      }
      .dot.live { background: #34d399; box-shadow: 0 0 14px #34d39966; }
      .dot.warn { background: #fbbf24; }
      .dot.bad { background: #f87171; }
      .answer-card {
        position: relative;
        margin-top: 12px;
        padding: 22px 20px 20px;
        min-height: 190px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 1px solid #27272a;
        border-radius: 22px;
        background: #121216;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
      }
      .label {
        position: absolute;
        top: 16px;
        left: 20px;
        color: #52525b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .14em;
      }
      #answer {
        margin-top: 12px;
        font-size: clamp(25px, 6.4vw, 38px);
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: -.02em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #answer.empty {
        color: #52525b;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .answer-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        color: #52525b;
        font-size: 11px;
      }
      #updated { min-height: 16px; }
      #copy {
        appearance: none;
        border: 1px solid #3f3f46;
        border-radius: 9px;
        background: #18181b;
        color: #d4d4d8;
        padding: 7px 11px;
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }
      #copy:disabled { opacity: .35; cursor: default; }
      #copy:active { transform: translateY(1px); }
      .note {
        margin-top: 24px;
        color: #52525b;
        font-size: 11.5px;
        line-height: 1.75;
      }
      .note strong { color: #71717a; font-weight: 600; }
      @media (prefers-reduced-motion: no-preference) {
        .answer-card { transition: border-color .25s ease, transform .25s ease; }
        .answer-card.has-answer { border-color: #3f3f46; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div class="brand">CUE AIR</div>
        <div class="badge">LOCAL ONLY</div>
      </div>

      <h1>최신 답변</h1>
      <p class="sub">PC의 Cue가 보낸 가장 최근 답변만 표시합니다.</p>

      <div class="status-row" role="status" aria-live="polite">
        <span id="dot" class="dot"></span>
        <span id="status">PC의 Cue에서 답변을 기다리는 중입니다.</span>
      </div>

      <section id="card" class="answer-card" aria-live="polite">
        <span class="label">ANSWER</span>
        <div id="answer" class="empty">아직 답변이 없습니다.</div>
        <div class="answer-footer">
          <span id="updated"></span>
          <button id="copy" type="button" disabled>복사</button>
        </div>
      </section>

      <p class="note">
        같은 Wi-Fi에서만 연결됩니다. 이 페이지는 답변을 저장하지 않으며,
        <strong>PC에서 서버를 재생성하면 기존 QR은 만료됩니다.</strong>
      </p>
    </main>

    <script>
      const token = new URLSearchParams(location.search).get('token') || ''
      const answer = document.getElementById('answer')
      const card = document.getElementById('card')
      const status = document.getElementById('status')
      const dot = document.getElementById('dot')
      const updated = document.getElementById('updated')
      const copy = document.getElementById('copy')
      let last = null
      let stopped = false
      let timer = null

      function setStatus(text, tone) {
        status.textContent = text
        dot.className = 'dot' + (tone ? ' ' + tone : '')
      }

      function show(value) {
        if (value === last) return
        last = value
        if (value) {
          answer.textContent = value
          answer.classList.remove('empty')
          card.classList.add('has-answer')
          updated.textContent = new Date().toLocaleTimeString('ko-KR', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          })
          copy.disabled = false
        } else {
          answer.textContent = '아직 답변이 없습니다.'
          answer.classList.add('empty')
          card.classList.remove('has-answer')
          updated.textContent = ''
          copy.disabled = true
        }
      }

      async function copyAnswer() {
        if (!last) return
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(last)
          } else {
            const area = document.createElement('textarea')
            area.value = last
            area.setAttribute('readonly', '')
            area.style.position = 'fixed'
            area.style.opacity = '0'
            document.body.appendChild(area)
            area.select()
            document.execCommand('copy')
            area.remove()
          }
          copy.textContent = '복사됨'
          setTimeout(() => { copy.textContent = '복사' }, 1400)
        } catch {
          copy.textContent = '복사 실패'
          setTimeout(() => { copy.textContent = '복사' }, 1400)
        }
      }

      function schedule(ms) {
        clearTimeout(timer)
        timer = setTimeout(poll, ms)
      }

      async function poll() {
        if (stopped) return
        if (!token) {
          setStatus('QR 코드를 다시 스캔해 주세요.', 'bad')
          return
        }
        if (document.hidden) {
          schedule(1000)
          return
        }
        try {
          const response = await fetch('/api/latest?token=' + encodeURIComponent(token), {
            cache: 'no-store',
          })
          if (response.status === 403) {
            stopped = true
            setStatus('연결이 만료되었습니다. PC에서 서버를 재생성하거나 QR을 다시 스캔해 주세요.', 'bad')
            return
          }
          if (!response.ok) throw new Error('http')
          const payload = await response.json()
          show(payload.answer || '')
          setStatus(
            payload.answer ? 'Cue의 최신 답변입니다.' : 'PC의 Cue에서 답변을 기다리는 중입니다.',
            payload.answer ? 'live' : '',
          )
          schedule(1000)
        } catch {
          setStatus('PC와의 연결을 확인하는 중입니다.', 'warn')
          schedule(1500)
        }
      }

      copy.addEventListener('click', copyAnswer)
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) schedule(0)
        else clearTimeout(timer)
      })
      poll()
    </script>
  </body>
</html>
